<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 530" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skills-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1017" />
      <stop offset="100%" stop-color="#080b10" />
    </linearGradient>

    <linearGradient id="neon-cyan-violet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="learning-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <filter id="pill-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    }
    .font-sans {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    /* Badge Animations */
    @keyframes learn-pulse {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.4; }
    }
    .learn-dot {
      animation: learn-pulse 1.8s ease-in-out infinite;
    }
  </style>

  <!-- Container Base -->
  <rect x="1" y="1" width="878" height="528" rx="14" fill="url(#skills-bg)" stroke="#30363d" stroke-width="1.5" />
  <rect x="1" y="1" width="878" height="528" rx="14" fill="none" stroke="url(#neon-cyan-violet)" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- HEADER -->
  <g transform="translate(30, 36)">
    <!-- Section Title -->
    <text x="0" y="0" fill="#22d3ee" font-size="14" class="font-mono" font-weight="700">// TECH STACK &amp; CAPABILITIES</text>
    <text x="0" y="20" fill="#8b949e" font-size="12" class="font-mono">Battle-tested tools, frameworks &amp; active research frontiers</text>

    <!-- Legend (Top Right) -->
    <g transform="translate(560, -2)">
      <!-- Using Tag -->
      <rect x="0" y="0" width="118" height="22" rx="11" fill="#161b22" stroke="#22d3ee" stroke-opacity="0.4" />
      <circle cx="12" cy="11" r="3.5" fill="#22d3ee" />
      <text x="22" y="15" fill="#e6edf3" font-size="10" class="font-mono" font-weight="600">USING / CORE</text>

      <!-- Learning Tag -->
      <rect x="126" y="0" width="134" height="22" rx="11" fill="#211326" stroke="#f43f5e" stroke-opacity="0.6" />
      <polygon points="138,8 142,14 134,14" fill="#f43f5e" class="learn-dot" />
      <text x="148" y="15" fill="#fda4af" font-size="10" class="font-mono" font-weight="700">LEARNING / R&amp;D</text>
    </g>
  </g>

  <!-- GRID CONTAINERS (2 Cols x 3 Rows) -->
  <!-- ROW 1 -->
  <!-- 1. LANGUAGES (Col 1) -->
  <g transform="translate(30, 85)">
    <rect width="395" height="130" rx="10" fill="#111620" stroke="#21262d" stroke-width="1" />
    <!-- Category Header -->
    <circle cx="18" cy="22" r="3" fill="#22d3ee" />
    <text x="28" y="26" fill="#e6edf3" font-size="12" class="font-mono" font-weight="700">PROGRAMMING LANGUAGES</text>
    <line x1="16" y1="36" x2="379" y2="36" stroke="#21262d" />

    <!-- Badges -->
    <g transform="translate(16, 48)">
      <!-- C -->
      <rect x="0" y="0" width="38" height="28" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="19" y="18" fill="#e6edf3" font-size="11.5" class="font-mono" font-weight="600" text-anchor="middle">C</text>
      <!-- C++ -->
      <rect x="46" y="0" width="50" height="28" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="71" y="18" fill="#e6edf3" font-size="11.5" class="font-mono" font-weight="600" text-anchor="middle">C++</text>
      <!-- Java -->
      <rect x="104" y="0" width="54" height="28" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="131" y="18" fill="#e6edf3" font-size="11.5" class="font-mono" font-weight="600" text-anchor="middle">Java</text>
      <!-- JavaScript -->
      <rect x="166" y="0" width="94" height="28" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="213" y="18" fill="#e6edf3" font-size="11.5" class="font-mono" font-weight="600" text-anchor="middle">JavaScript</text>
      <!-- TypeScript -->
      <rect x="268" y="0" width="94" height="28" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="315" y="18" fill="#e6edf3" font-size="11.5" class="font-mono" font-weight="600" text-anchor="middle">TypeScript</text>

      <!-- Row 2 -->
      <!-- Python -->
      <rect x="0" y="36" width="68" height="28" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="34" y="54" fill="#e6edf3" font-size="11.5" class="font-mono" font-weight="600" text-anchor="middle">Python</text>
      <!-- SQL -->
      <rect x="76" y="36" width="50" height="28" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="101" y="54" fill="#e6edf3" font-size="11.5" class="font-mono" font-weight="600" text-anchor="middle">SQL</text>
      <!-- Solidity -->
      <rect x="134" y="36" width="82" height="28" rx="6" fill="#15212d" stroke="#22d3ee" stroke-opacity="0.6" />
      <circle cx="145" cy="50" r="3" fill="#22d3ee" />
      <text x="180" y="54" fill="#22d3ee" font-size="11.5" class="font-mono" font-weight="700" text-anchor="middle">Solidity</text>
    </g>
  </g>

  <!-- 2. BLOCKCHAIN & WEB3 (Col 2) -->
  <g transform="translate(455, 85)">
    <rect width="395" height="130" rx="10" fill="#111620" stroke="#21262d" stroke-width="1" />
    <circle cx="18" cy="22" r="3" fill="#22d3ee" />
    <text x="28" y="26" fill="#e6edf3" font-size="12" class="font-mono" font-weight="700">BLOCKCHAIN &amp; WEB3</text>
    <line x1="16" y1="36" x2="379" y2="36" stroke="#21262d" />

    <g transform="translate(16, 48)">
      <!-- Solidity -->
      <rect x="0" y="0" width="82" height="28" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="41" y="18" fill="#e6edf3" font-size="11.5" class="font-mono" font-weight="600" text-anchor="middle">Solidity</text>
      <!-- Ethers.js -->
      <rect x="90" y="0" width="84" height="28" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="132" y="18" fill="#e6edf3" font-size="11.5" class="font-mono" font-weight="600" text-anchor="middle">Ethers.js</text>
      <!-- Hardhat -->
      <rect x="182" y="0" width="78" height="28" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="221" y="18" fill="#e6edf3" font-size="11.5" class="font-mono" font-weight="600" text-anchor="middle">Hardhat</text>
      <!-- Smart Contracts -->
      <rect x="0" y="36" width="134" height="28" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="67" y="54" fill="#e6edf3" font-size="11.5" class="font-mono" font-weight="600" text-anchor="middle">Smart Contracts</text>
      <!-- Fraud Detection -->
      <rect x="142" y="36" width="138" height="28" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="211" y="54" fill="#e6edf3" font-size="11.5" class="font-mono" font-weight="600" text-anchor="middle">Supply Chain DeFi</text>
    </g>
  </g>

  <!-- ROW 2 -->
  <!-- 3. FRONTEND & 3D (Col 1) -->
  <g transform="translate(30, 230)">
    <rect width="395" height="130" rx="10" fill="#111620" stroke="#21262d" stroke-width="1" />
    <circle cx="18" cy="22" r="3" fill="#8b5cf6" />
    <text x="28" y="26" fill="#e6edf3" font-size="12" class="font-mono" font-weight="700">FRONTEND &amp; 3D SIMULATION</text>
    <line x1="16" y1="36" x2="379" y2="36" stroke="#21262d" />

    <g transform="translate(16, 48)">
      <!-- React -->
      <rect x="0" y="0" width="62" height="28" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="31" y="18" fill="#e6edf3" font-size="11.5" class="font-mono" font-weight="600" text-anchor="middle">React</text>
      <!-- Next.js -->
      <rect x="70" y="0" width="76" height="28" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="108" y="18" fill="#e6edf3" font-size="11.5" class="font-mono" font-weight="600" text-anchor="middle">Next.js</text>
      <!-- TailwindCSS -->
      <rect x="154" y="0" width="102" height="28" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="205" y="18" fill="#e6edf3" font-size="11.5" class="font-mono" font-weight="600" text-anchor="middle">TailwindCSS</text>
      <!-- WebGL / 3D -->
      <rect x="0" y="36" width="94" height="28" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="47" y="54" fill="#e6edf3" font-size="11.5" class="font-mono" font-weight="600" text-anchor="middle">WebGL 3D</text>
      <!-- Three.js -->
      <rect x="102" y="36" width="82" height="28" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="143" y="54" fill="#e6edf3" font-size="11.5" class="font-mono" font-weight="600" text-anchor="middle">Three.js</text>
    </g>
  </g>

  <!-- 4. BACKEND & DATA (Col 2) -->
  <g transform="translate(455, 230)">
    <rect width="395" height="130" rx="10" fill="#111620" stroke="#21262d" stroke-width="1" />
    <circle cx="18" cy="22" r="3" fill="#8b5cf6" />
    <text x="28" y="26" fill="#e6edf3" font-size="12" class="font-mono" font-weight="700">BACKEND &amp; DATABASES</text>
    <line x1="16" y1="36" x2="379" y2="36" stroke="#21262d" />

    <g transform="translate(16, 48)">
      <!-- Node.js / Express -->
      <rect x="0" y="0" width="112" height="28" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="56" y="18" fill="#e6edf3" font-size="11.5" class="font-mono" font-weight="600" text-anchor="middle">Node / Express</text>
      <!-- FastAPI -->
      <rect x="120" y="0" width="76" height="28" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="158" y="18" fill="#e6edf3" font-size="11.5" class="font-mono" font-weight="600" text-anchor="middle">FastAPI</text>
      <!-- PostgreSQL -->
      <rect x="0" y="36" width="100" height="28" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="50" y="54" fill="#e6edf3" font-size="11.5" class="font-mono" font-weight="600" text-anchor="middle">PostgreSQL</text>
      <!-- Redis -->
      <rect x="108" y="36" width="60" height="28" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="138" y="54" fill="#e6edf3" font-size="11.5" class="font-mono" font-weight="600" text-anchor="middle">Redis</text>
      <!-- RESTful APIs -->
      <rect x="176" y="36" width="94" height="28" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="223" y="54" fill="#e6edf3" font-size="11.5" class="font-mono" font-weight="600" text-anchor="middle">REST APIs</text>
    </g>
  </g>

  <!-- ROW 3 -->
  <!-- 5. AI, AGENTS & ML (Col 1 - LEARNING SPECIAL DESIGN) -->
  <g transform="translate(30, 375)">
    <rect width="395" height="130" rx="10" fill="#1a121e" stroke="#f43f5e" stroke-opacity="0.3" stroke-width="1.2" />
    <polygon points="18,18 23,26 13,26" fill="#f43f5e" class="learn-dot" />
    <text x="28" y="26" fill="#fda4af" font-size="12" class="font-mono" font-weight="700">AI &amp; AGENT EXPLORATION [LEARNING]</text>
    <line x1="16" y1="36" x2="379" y2="36" stroke="#381b2a" />

    <g transform="translate(16, 48)">
      <!-- Generative AI -->
      <rect x="0" y="0" width="122" height="28" rx="6" fill="#241424" stroke="#f43f5e" stroke-opacity="0.5" />
      <polygon points="12,11 16,17 8,17" fill="#f43f5e" />
      <text x="69" y="18" fill="#fda4af" font-size="11.5" class="font-mono" font-weight="600" text-anchor="middle">Generative AI</text>
      <!-- LLM Prompting -->
      <rect x="130" y="0" width="134" height="28" rx="6" fill="#241424" stroke="#f43f5e" stroke-opacity="0.5" />
      <polygon points="142,11 146,17 138,17" fill="#f43f5e" />
      <text x="202" y="18" fill="#fda4af" font-size="11.5" class="font-mono" font-weight="600" text-anchor="middle">Prompt Eng.</text>

      <!-- Autonomous Agents -->
      <rect x="0" y="36" width="160" height="28" rx="6" fill="#241424" stroke="#f43f5e" stroke-opacity="0.5" />
      <polygon points="12,47 16,53 8,53" fill="#f43f5e" />
      <text x="88" y="54" fill="#fda4af" font-size="11.5" class="font-mono" font-weight="600" text-anchor="middle">Autonomous Agents</text>
      <!-- Statistical Modelling -->
      <rect x="168" y="36" width="156" height="28" rx="6" fill="#241424" stroke="#f43f5e" stroke-opacity="0.5" />
      <polygon points="180,47 184,53 176,53" fill="#f43f5e" />
      <text x="252" y="54" fill="#fda4af" font-size="11.5" class="font-mono" font-weight="600" text-anchor="middle">ML &amp; Stat Models</text>
    </g>
  </g>

  <!-- 6. DEVOPS & INFRASTRUCTURE (Col 2) -->
  <g transform="translate(455, 375)">
    <rect width="395" height="130" rx="10" fill="#111620" stroke="#21262d" stroke-width="1" />
    <circle cx="18" cy="22" r="3" fill="#22d3ee" />
    <text x="28" y="26" fill="#e6edf3" font-size="12" class="font-mono" font-weight="700">DEVOPS, TOOLS &amp; SECURITY</text>
    <line x1="16" y1="36" x2="379" y2="36" stroke="#21262d" />

    <g transform="translate(16, 48)">
      <!-- Docker -->
      <rect x="0" y="0" width="70" height="28" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="35" y="18" fill="#e6edf3" font-size="11.5" class="font-mono" font-weight="600" text-anchor="middle">Docker</text>
      <!-- Git & GitHub -->
      <rect x="78" y="0" width="60" height="28" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="108" y="18" fill="#e6edf3" font-size="11.5" class="font-mono" font-weight="600" text-anchor="middle">Git</text>
      <!-- Linux -->
      <rect x="146" y="0" width="62" height="28" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="177" y="18" fill="#e6edf3" font-size="11.5" class="font-mono" font-weight="600" text-anchor="middle">Linux</text>
      <!-- Network Security -->
      <rect x="0" y="36" width="138" height="28" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="69" y="54" fill="#e6edf3" font-size="11.5" class="font-mono" font-weight="600" text-anchor="middle">Network Security</text>
      <!-- MATLAB -->
      <rect x="146" y="36" width="76" height="28" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="184" y="54" fill="#e6edf3" font-size="11.5" class="font-mono" font-weight="600" text-anchor="middle">MATLAB</text>
    </g>
  </g>
</svg>
