<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="card-bg-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1420" />
      <stop offset="100%" stop-color="#080b10" />
    </linearGradient>

    <!-- Neon Accent Gradient -->
    <linearGradient id="neon-cyan-violet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <linearGradient id="badge-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <filter id="glow-card" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    }
    .font-sans {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    @keyframes star-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.15); opacity: 0.8; }
    }
    .star-icon {
      transform-origin: 38px 36px;
      animation: star-pulse 2.5s ease-in-out infinite;
    }

    @keyframes line-glow {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.9; }
    }
    .accent-border {
      animation: line-glow 3s infinite ease-in-out;
    }
  </style>

  <!-- Container Base -->
  <rect x="1" y="1" width="878" height="228" rx="14" fill="url(#card-bg-1)" stroke="#30363d" stroke-width="1.5" />
  
  <!-- Active Neon Left & Top Border Accent -->
  <rect x="1" y="1" width="878" height="228" rx="14" fill="none" stroke="url(#neon-cyan-violet)" stroke-width="1.5" class="accent-border" />
  <path d="M 1 40 L 1 14 Q 1 1 14 1 L 60 1" fill="none" stroke="#22d3ee" stroke-width="2.5" filter="url(#glow-card)" />

  <!-- HEADER ROW -->
  <g transform="translate(32, 38)">
    <!-- Featured Badge -->
    <rect x="0" y="0" width="186" height="26" rx="13" fill="#241a0d" stroke="#f59e0b" stroke-opacity="0.8" stroke-width="1" />
    <g class="star-icon">
      <text x="14" y="18" fill="#f59e0b" font-size="13">★</text>
    </g>
    <text x="28" y="18" fill="#fbbf24" font-size="11" class="font-mono" font-weight="700" letter-spacing="0.5">
      FEATURED ECOSYSTEM
    </text>

    <!-- Category Pill -->
    <rect x="196" y="0" width="138" height="26" rx="13" fill="#141c2c" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="1" />
    <text x="265" y="18" fill="#22d3ee" font-size="11" class="font-mono" font-weight="600" text-anchor="middle">
      BLOCKCHAIN / DEFI
    </text>

    <!-- Repos Badge Tag (Top Right) -->
    <g transform="translate(620, 2)">
      <rect x="0" y="0" width="195" height="24" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="97" y="16" fill="#8b949e" font-size="10.5" class="font-mono" text-anchor="middle">
        REPOS: AgriChain + AgriChain_block
      </text>
    </g>
  </g>

  <!-- TITLE & IMPACT -->
  <g transform="translate(32, 92)">
    <text x="0" y="0" fill="#ffffff" font-size="24" class="font-sans" font-weight="800" letter-spacing="-0.5">
      AgriChain <tspan fill="#8b5cf6" font-size="18" font-weight="500">— Decentralized Agricultural Provenance &amp; Fraud Detection</tspan>
    </text>
    <text x="0" y="28" fill="#94a3b8" font-size="14" class="font-sans" font-weight="400">
      Decentralized supply chain platform utilizing Ethereum smart contracts to guarantee crop provenance, prevent fraudulent distributor claims, and enforce milestone-based automated escrow settlements.
    </text>
  </g>

  <!-- TECH STACK PILLS & ACTIONS (BOTTOM ROW) -->
  <g transform="translate(32, 168)">
    <!-- Tech Stack Group -->
    <g transform="translate(0, 0)">
      <!-- Solidity -->
      <rect x="0" y="0" width="76" height="28" rx="6" fill="#161b22" stroke="#22d3ee" stroke-opacity="0.4" />
      <text x="38" y="18" fill="#22d3ee" font-size="11.5" class="font-mono" font-weight="600" text-anchor="middle">Solidity</text>

      <!-- Hardhat -->
      <rect x="84" y="0" width="76" height="28" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="122" y="18" fill="#e6edf3" font-size="11.5" class="font-mono" font-weight="500" text-anchor="middle">Hardhat</text>

      <!-- Ethers.js -->
      <rect x="168" y="0" width="82" height="28" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="209" y="18" fill="#e6edf3" font-size="11.5" class="font-mono" font-weight="500" text-anchor="middle">Ethers.js</text>

      <!-- React -->
      <rect x="258" y="0" width="62" height="28" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="289" y="18" fill="#e6edf3" font-size="11.5" class="font-mono" font-weight="500" text-anchor="middle">React</text>

      <!-- Node.js -->
      <rect x="328" y="0" width="76" height="28" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="366" y="18" fill="#e6edf3" font-size="11.5" class="font-mono" font-weight="500" text-anchor="middle">Node.js</text>
    </g>

    <!-- View Repo Button / Link Visual -->
    <g transform="translate(615, 0)">
      <rect x="0" y="0" width="200" height="30" rx="8" fill="#161b22" stroke="#22d3ee" stroke-width="1.2" />
      <text x="86" y="20" fill="#22d3ee" font-size="12" class="font-mono" font-weight="700">EXPLORE REPOS</text>
      <text x="175" y="20" fill="#22d3ee" font-size="14" class="font-mono" font-weight="700">↗</text>
    </g>
  </g>
</svg>
