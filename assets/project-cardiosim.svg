<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="card-bg-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190e15" />
      <stop offset="100%" stop-color="#090a10" />
    </linearGradient>

    <linearGradient id="pink-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <filter id="glow-card-3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    }
    .font-sans {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      14% { transform: scale(1.2); opacity: 1; }
      28% { transform: scale(1); opacity: 0.9; }
      42% { transform: scale(1.15); opacity: 1; }
      70% { transform: scale(1); opacity: 0.9; }
    }
    .heart-icon {
      transform-origin: 16px 13px;
      animation: heartbeat 1.8s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
    }
  </style>

  <!-- Container Base -->
  <rect x="1" y="1" width="878" height="218" rx="14" fill="url(#card-bg-3)" stroke="#30363d" stroke-width="1.5" />
  <rect x="1" y="1" width="878" height="218" rx="14" fill="none" stroke="url(#pink-cyan)" stroke-width="1.5" stroke-opacity="0.3" />
  <path d="M 1 40 L 1 14 Q 1 1 14 1 L 60 1" fill="none" stroke="#f43f5e" stroke-width="2.5" filter="url(#glow-card-3)" />

  <!-- HEADER ROW -->
  <g transform="translate(32, 36)">
    <!-- Category Tag -->
    <rect x="0" y="0" width="180" height="26" rx="13" fill="#29111b" stroke="#f43f5e" stroke-opacity="0.8" stroke-width="1" />
    <g class="heart-icon">
      <circle cx="16" cy="13" r="4.5" fill="#f43f5e" />
    </g>
    <text x="28" y="18" fill="#fda4af" font-size="11" class="font-mono" font-weight="700" letter-spacing="0.5">
      3D SIMULATION / WEBGL
    </text>

    <!-- Repo Badge Tag (Top Right) -->
    <g transform="translate(610, 2)">
      <rect x="0" y="0" width="205" height="24" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="102" y="16" fill="#8b949e" font-size="10.5" class="font-mono" text-anchor="middle">
        REPOS: Heart_Sim + Heart-simulator
      </text>
    </g>
  </g>

  <!-- TITLE & IMPACT -->
  <g transform="translate(32, 90)">
    <text x="0" y="0" fill="#ffffff" font-size="24" class="font-sans" font-weight="800" letter-spacing="-0.5">
      CardioSim 3D <tspan fill="#22d3ee" font-size="18" font-weight="500">— Interactive WebGL Heart Simulation</tspan>
    </text>
    <text x="0" y="28" fill="#94a3b8" font-size="14" class="font-sans" font-weight="400">
      Interactive browser-based 3D cardiac anatomical simulation with orbital camera controls, dynamic cross-section inspection, and pedagogical pathology visualization built on Three.js &amp; WebGL shaders.
    </text>
  </g>

  <!-- TECH STACK PILLS & ACTIONS (BOTTOM ROW) -->
  <g transform="translate(32, 160)">
    <!-- Tech Stack Group -->
    <g transform="translate(0, 0)">
      <!-- WebGL -->
      <rect x="0" y="0" width="76" height="28" rx="6" fill="#161b22" stroke="#f43f5e" stroke-opacity="0.5" />
      <text x="38" y="18" fill="#fb7185" font-size="11.5" class="font-mono" font-weight="600" text-anchor="middle">WebGL</text>

      <!-- Three.js -->
      <rect x="84" y="0" width="82" height="28" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="125" y="18" fill="#e6edf3" font-size="11.5" class="font-mono" font-weight="500" text-anchor="middle">Three.js</text>

      <!-- JavaScript -->
      <rect x="174" y="0" width="94" height="28" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="221" y="18" fill="#e6edf3" font-size="11.5" class="font-mono" font-weight="500" text-anchor="middle">JavaScript</text>

      <!-- TailwindCSS -->
      <rect x="276" y="0" width="100" height="28" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="326" y="18" fill="#e6edf3" font-size="11.5" class="font-mono" font-weight="500" text-anchor="middle">TailwindCSS</text>

      <!-- Shaders -->
      <rect x="384" y="0" width="80" height="28" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="424" y="18" fill="#e6edf3" font-size="11.5" class="font-mono" font-weight="500" text-anchor="middle">GLSL</text>
    </g>

    <!-- View Repo Button / Link Visual -->
    <g transform="translate(635, 0)">
      <rect x="0" y="0" width="180" height="30" rx="8" fill="#161b22" stroke="#f43f5e" stroke-width="1.2" />
      <text x="76" y="20" fill="#fb7185" font-size="12" class="font-mono" font-weight="700">VIEW REPO</text>
      <text x="155" y="20" fill="#fb7185" font-size="14" class="font-mono" font-weight="700">↗</text>
    </g>
  </g>
</svg>
