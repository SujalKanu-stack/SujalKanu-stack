<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="100%" height="24">
  <defs>
    <linearGradient id="div-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0" />
      <stop offset="25%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="1" />
      <stop offset="75%" stop-color="#f43f5e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </linearGradient>

    <filter id="div-glow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulse-sweep {
      0% { transform: translateX(-400px); }
      100% { transform: translateX(900px); }
    }
    .pulse-effect {
      animation: pulse-sweep 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes center-pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; }
    }
    .center-node {
      transform-origin: 450px 12px;
      animation: center-pulse 2s ease-in-out infinite;
    }
  </style>

  <!-- Base Line -->
  <line x1="50" y1="12" x2="850" y2="12" stroke="url(#div-grad)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Moving Pulse -->
  <g class="pulse-effect">
    <rect x="0" y="10" width="120" height="4" rx="2" fill="url(#pulse-grad)" filter="url(#div-glow)" />
  </g>

  <!-- Center Diamond & Accent Nodes -->
  <g class="center-node">
    <polygon points="450,6 456,12 450,18 444,12" fill="#8b5cf6" filter="url(#div-glow)" />
    <circle cx="450" cy="12" r="2" fill="#ffffff" />
  </g>
  <circle cx="430" cy="12" r="1.5" fill="#22d3ee" opacity="0.7" />
  <circle cx="470" cy="12" r="1.5" fill="#f43f5e" opacity="0.7" />
</svg>
