<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="100%" height="100%">
  <defs>
    <!-- Background & Gradients -->
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1017" />
      <stop offset="100%" stop-color="#070a0f" />
    </linearGradient>

    <linearGradient id="header-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0e131a" />
    </linearGradient>

    <linearGradient id="neon-cyan-violet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <filter id="cursor-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', Consolas, monospace;
    }
    
    /* Blinking Cursor Animation */
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .cursor {
      animation: blink 1s infinite;
    }

    /* Status Pulse */
    @keyframes status-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.15); }
    }
    .status-dot {
      transform-origin: 196px 260px;
      animation: status-pulse 2s infinite ease-in-out;
    }
  </style>

  <!-- Window Container with Rounded Corners -->
  <rect x="1" y="1" width="878" height="348" rx="12" fill="url(#term-bg)" stroke="#30363d" stroke-width="1.5" />
  
  <!-- Subtle Neon Edge Accent -->
  <rect x="1" y="1" width="878" height="348" rx="12" fill="none" stroke="url(#neon-cyan-violet)" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Terminal Title Bar -->
  <path d="M 1 13 Q 1 1 13 1 L 867 1 Q 879 1 879 13 L 879 40 L 1 40 Z" fill="url(#header-bg)" />
  <line x1="1" y1="40" x2="879" y2="40" stroke="#30363d" stroke-width="1" />

  <!-- Window Controls (Red, Yellow, Green) -->
  <circle cx="22" cy="20" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
  <circle cx="42" cy="20" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
  <circle cx="62" cy="20" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />

  <!-- Window Title -->
  <g transform="translate(440, 25)">
    <text x="0" y="0" fill="#8b949e" font-size="12" class="font-mono" font-weight="600" text-anchor="middle">
      sujal@workstation:~ (zsh) — 80x24
    </text>
  </g>

  <!-- Right Window Status Pill -->
  <g transform="translate(805, 20)">
    <circle cx="0" cy="0" r="4" fill="#22d3ee">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <text x="8" y="3.5" fill="#22d3ee" font-size="10" class="font-mono" font-weight="700">READY</text>
  </g>

  <!-- TERMINAL CONTENT -->
  <g transform="translate(28, 72)">
    <!-- Command Line -->
    <text x="0" y="0" fill="#8b5cf6" font-size="14" class="font-mono" font-weight="700">sujal@bmsit</text>
    <text x="96" y="0" fill="#8b949e" font-size="14" class="font-mono">:</text>
    <text x="108" y="0" fill="#22d3ee" font-size="14" class="font-mono" font-weight="700">~</text>
    <text x="120" y="0" fill="#8b949e" font-size="14" class="font-mono">$</text>
    <text x="135" y="0" fill="#e6edf3" font-size="14" class="font-mono" font-weight="600">whoami --spec=engineer --verbose</text>

    <!-- Output Divider -->
    <line x1="0" y1="16" x2="824" y2="16" stroke="#21262d" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Details Grid -->
    <g transform="translate(0, 42)">
      <!-- Label 1: NAME -->
      <text x="0" y="0" fill="#8b949e" font-size="13.5" class="font-mono" font-weight="600">NAME</text>
      <text x="125" y="0" fill="#8b949e" font-size="13.5" class="font-mono">:</text>
      <text x="145" y="0" fill="#ffffff" font-size="13.5" class="font-mono" font-weight="700">Sujal Kumar Kanu</text>
      <text x="305" y="0" fill="#8b949e" font-size="12" class="font-mono">(he/him)</text>

      <!-- Label 2: ROLE -->
      <text x="0" y="28" fill="#8b949e" font-size="13.5" class="font-mono" font-weight="600">ROLE</text>
      <text x="125" y="28" fill="#8b949e" font-size="13.5" class="font-mono">:</text>
      <text x="145" y="28" fill="#22d3ee" font-size="13.5" class="font-mono" font-weight="600">Full-Stack Engineer &amp; Web3 / Generative AI Builder</text>

      <!-- Label 3: EDUCATION -->
      <text x="0" y="56" fill="#8b949e" font-size="13.5" class="font-mono" font-weight="600">EDUCATION</text>
      <text x="125" y="56" fill="#8b949e" font-size="13.5" class="font-mono">:</text>
      <text x="145" y="56" fill="#e6edf3" font-size="13.5" class="font-mono">3rd-Year B.E. Computer Science &amp; Engg</text>
      <text x="475" y="56" fill="#8b5cf6" font-size="13.5" class="font-mono" font-weight="600">@ BMSIT&amp;M (VTU)</text>

      <!-- Label 4: LOCATION -->
      <text x="0" y="84" fill="#8b949e" font-size="13.5" class="font-mono" font-weight="600">LOCATION</text>
      <text x="125" y="84" fill="#8b949e" font-size="13.5" class="font-mono">:</text>
      <text x="145" y="84" fill="#e6edf3" font-size="13.5" class="font-mono">Bengaluru, India 🇮🇳</text>
      <text x="325" y="84" fill="#8b949e" font-size="12" class="font-mono">[IST • UTC +05:30]</text>

      <!-- Label 5: DOMAINS -->
      <text x="0" y="112" fill="#8b949e" font-size="13.5" class="font-mono" font-weight="600">CORE FOCUS</text>
      <text x="125" y="112" fill="#8b949e" font-size="13.5" class="font-mono">:</text>
      <text x="145" y="112" fill="#e6edf3" font-size="13.5" class="font-mono">Full-Stack Web <tspan fill="#8b5cf6">|</tspan> Blockchain &amp; Smart Contracts <tspan fill="#8b5cf6">|</tspan> GenAI Agents <tspan fill="#8b5cf6">|</tspan> 3D Simulation</text>

      <!-- Label 6: STATUS -->
      <text x="0" y="142" fill="#8b949e" font-size="13.5" class="font-mono" font-weight="600">STATUS</text>
      <text x="125" y="142" fill="#8b949e" font-size="13.5" class="font-mono">:</text>
      
      <!-- Status Badge -->
      <g transform="translate(145, 126)">
        <rect x="0" y="0" width="370" height="24" rx="12" fill="#11271e" stroke="#22c55e" stroke-width="1" />
        <circle cx="14" cy="12" r="4.5" fill="#22c55e" class="status-dot" />
        <text x="27" y="16" fill="#4ade80" font-size="12" class="font-mono" font-weight="700" letter-spacing="0.3">
          OPEN TO INTERNSHIPS / CAMPUS PLACEMENTS 2027
        </text>
      </g>

      <!-- Label 7: LEARNING -->
      <text x="0" y="176" fill="#8b949e" font-size="13.5" class="font-mono" font-weight="600">LEARNING</text>
      <text x="125" y="176" fill="#8b949e" font-size="13.5" class="font-mono">:</text>
      <text x="145" y="176" fill="#fb7185" font-size="13.5" class="font-mono" font-weight="600">Autonomous GenAI Agents, LLM Prompt Engineering &amp; ML Models</text>

      <!-- Label 8: INTERESTS -->
      <text x="0" y="204" fill="#8b949e" font-size="13.5" class="font-mono" font-weight="600">INTERESTS</text>
      <text x="125" y="204" fill="#8b949e" font-size="13.5" class="font-mono">:</text>
      <text x="145" y="204" fill="#cbd5e1" font-size="13.5" class="font-mono">Ethical Hacking, Network Security, Statistical Modelling</text>
    </g>

    <!-- Bottom Prompt with Blinking Cursor -->
    <g transform="translate(0, 274)">
      <text x="0" y="0" fill="#22d3ee" font-size="14" class="font-mono" font-weight="700">sujal@bmsit</text>
      <text x="96" y="0" fill="#8b949e" font-size="14" class="font-mono">:</text>
      <text x="108" y="0" fill="#8b5cf6" font-size="14" class="font-mono" font-weight="700">~/projects</text>
      <text x="195" y="0" fill="#8b949e" font-size="14" class="font-mono">$</text>
      <text x="210" y="0" fill="#ffffff" font-size="14" class="font-mono" font-weight="600">git status</text>
      <!-- Blinking block cursor -->
      <rect x="296" y="-12" width="8.5" height="15" fill="#22d3ee" class="cursor" filter="url(#cursor-glow)" />
    </g>
  </g>
</svg>
