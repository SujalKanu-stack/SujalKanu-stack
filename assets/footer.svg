<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 110" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="footer-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1017" />
      <stop offset="100%" stop-color="#07090d" />
    </linearGradient>

    <!-- Neon Accent Gradient -->
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <filter id="footer-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    }
    .font-sans {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    @keyframes wave-flow {
      0% { d: path("M 0 35 Q 220 15 440 35 T 880 35"); }
      50% { d: path("M 0 35 Q 220 55 440 35 T 880 35"); }
      100% { d: path("M 0 35 Q 220 15 440 35 T 880 35"); }
    }
    .wave-line {
      animation: wave-flow 6s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.6; }
    }
    .dot-pulse {
      transform-origin: 320px 58px;
      animation: pulse-dot 2s ease-in-out infinite;
    }
  </style>

  <!-- Container Base -->
  <rect x="1" y="1" width="878" height="108" rx="12" fill="url(#footer-bg)" stroke="#30363d" stroke-width="1" />
  <rect x="1" y="1" width="878" height="108" rx="12" fill="none" stroke="url(#neon-grad)" stroke-width="1" stroke-opacity="0.3" />

  <!-- Animated Neon Wave Line -->
  <path class="wave-line" d="M 0 35 Q 220 15 440 35 T 880 35" fill="none" stroke="url(#neon-grad)" stroke-width="1.8" opacity="0.4" />

  <!-- Centered Content -->
  <g transform="translate(440, 50)" text-anchor="middle">
    <!-- Status Pill -->
    <g transform="translate(0, 0)">
      <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#11271e" stroke="#22c55e" stroke-opacity="0.7" stroke-width="1" />
      <circle cx="-118" cy="0" r="4" fill="#22c55e" />
      <text x="8" y="4" fill="#4ade80" font-size="11.5" class="font-mono" font-weight="700" letter-spacing="0.5">
        OPEN TO COLLABORATE &amp; HIRE
      </text>
    </g>

    <!-- Subtitle / Copyright Line -->
    <text x="0" y="34" fill="#8b949e" font-size="11.5" class="font-mono">
      Designed &amp; Engineered by <tspan fill="#ffffff" font-weight="700">Sujal Kumar Kanu</tspan> • Bengaluru, India • 2026
    </text>
  </g>
</svg>
